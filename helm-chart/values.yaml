# Values for NEF Simulator Helm Chart

# Global configuration
configName: nef-config
secretsName: nef-secrets

# Postgres configuration
postgres:
  enabled: true
  name: postgres
  deployment:
    image: postgres:12
    env:
      - name: PGDATA
        value: /var/lib/postgresql/data/pgdata
  service:
    type: ClusterIP
    ports:
      - port: 5432
        targetPort: 5432

# PgAdmin configuration
pgadmin:
  enabled: true
  name: pgadmin
  deployment:
    image: dpage/pgadmin4
    ports:
      - containerPort: 5050
  service:
    type: ClusterIP
    ports:
      - port: 5050
        targetPort: 5050

# Mongo configuration
mongo:
  enabled: true
  name: mongo
  deployment:
    image: mongo:4.4.10
    ports:
      - containerPort: 27017
  service:
    type: ClusterIP
    ports:
      - port: 27017
        targetPort: 27017

mongoExpress:
  enabled: true
  name: mongo-express
  deployment:
    image: mongo-express:1.0.0-alpha.4
    ports:
      - containerPort: 8081
  service:
    type: ClusterIP
    ports:
      - port: 8081
        targetPort: 8081
        protocol: TCP

# RabbitMQ configuration
rabbitmq:
  enabled: true
  name: rabbitmq
  deployment:
    image: rabbitmq:management
    ports:
      - containerPort: 5672
        protocol: TCP
      - containerPort: 15672
        protocol: TCP
  service:
    type: ClusterIP
    ports:
      - name: amqp
        port: 5672
        targetPort: 5672
      - name: http
        port: 15672
        targetPort: 15672

# Report configuration
report:
  enabled: true
  name: report
  deployment:
    image: ghcr.io/migas77/report:latest
    ports:
      - containerPort: 3000
  service:
    type: LoadBalancer
    ports:
      - port: 3000
        targetPort: 3000
        protocol: TCP

# Backend configuration
backend:
  enabled: true
  name: backend
  deployment:
    image: ghcr.io/migas77/backend:latest
    ports:
      - containerPort: 80
  service:
    type: LoadBalancer
    ports:
      - port: 8888
        targetPort: 80
        protocol: TCP

# Nginx reverse proxy (TLS termination + mTLS client-cert check required by CAPIF)
nginx:
  enabled: true
  name: nginx
  deployment:
    image: ghcr.io/migas77/nginx-nef:latest
    ports:
      - containerPort: 80
      - containerPort: 443
  service:
    type: LoadBalancer
    ports:
      - name: http
        port: 8080
        targetPort: 80
        protocol: TCP
      - name: https
        port: 443
        targetPort: 443
        protocol: TCP

# CAPIF integration.
# The backend generates its onboarding certificates at runtime under
# app/capif/certificates/<CAPIF_USERNAME>/ and nginx needs those same files
# to terminate TLS/mTLS. Since there's no shared filesystem across nodes by
# default, certs are shared via a hostPath volume - which means every pod
# that mounts it (nginx + all backend replicas) MUST land on the same node.
# Set capif.nodeSelector to pin them there (e.g. a single-node/dev cluster).
capif:
  enabled: true
  # Offboard + unpublish from CAPIF core on pod shutdown (SIGTERM), e.g. on
  # helm uninstall/rollout - so CAPIF core doesn't accumulate stale
  # registrations across reinstalls (see the "Already registered service
  # with same api name" 403 this caused before).
  cleanupOnShutdown: true
  hostPath: /mnt/nef-capif-certs
  nodeSelector: {}
  host: capifcore
  registerHost: capifcore
  httpsPort: "443"
  registerPort: "8084"
  username: nef_provider
  # password should be overridden with --set capif.password=... or a values override file, not committed here
  password: password
